    table{width:100%;border-collapse:collapse;font-size:14px;} /* Mengatur tabel selebar penuh kontainer dengan garis batas rapat */

    .col-id{width:48px;color:var(--muted);} /* Membatasi lebar dan warna kolom nomor urut */
