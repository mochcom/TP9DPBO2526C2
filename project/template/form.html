<!doctype html> <!-- Mendeklarasikan tipe dokumen sebagai HTML5 -->
<html lang="id"> <!-- Membuka elemen root HTML berbahasa Indonesia -->
<head> <!-- Membuka bagian kepala dokumen -->
  <meta charset="utf-8" /> <!-- Menentukan pengkodean karakter UTF-8 -->
  <meta name="viewport" content="width=device-width,initial-scale=1" /> <!-- Mengatur tampilan responsif -->
  <title>Form Kandidat Karyawan</title> <!-- Menentukan judul tab browser -->
  <style> /* Membuka blok gaya CSS internal */
    :root{ /* Mendefinisikan variabel desain global form */
      --bg: #f7f8fb; /* Warna latar belakang halaman */
      --card: #ffffff; /* Warna kartu form */
      --muted: #6b7280; /* Warna teks label dan tombol batal */
      --accent: #2563eb; /* Warna biru tombol simpan */
      --border: #e6e9ef; /* Warna garis tepi */
      --radius: 8px; /* Radius sudut kartu */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; /* Menetapkan font sistem */
    } /* Menutup blok variabel :root */
    html,body{height:100%;margin:0;background:var(--bg);color:#0f172a;} /* Gaya dasar halaman */
    .container{max-width:650px;margin:36px auto;padding:18px;} /* Pembungkus tengah form */
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:0 1px 3px rgba(16,24,40,0.04);} /* Gaya kartu putih form */
    h1{margin:0 0 16px;font-size:20px;color:#0f172a;} /* Gaya judul form */
    form{display:grid;grid-template-columns:1fr 1fr;gap:14px;} /* Tata letak grid 2 kolom untuk input */
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500;} /* Gaya label input */
    input[type="text"],input[type="number"]{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;} /* Gaya kotak input teks dan angka */
    .full{grid-column:1/-1;} /* Melebarkan elemen memenuhi 2 kolom penuh */
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;} /* Menjajarkan tombol aksi di kanan bawah */
    .btn{padding:9px 16px;border-radius:6px;border:1px solid transparent;font-size:14px;cursor:pointer;text-decoration:none;} /* Gaya dasar tombol */
    .btn-primary{background:var(--accent);color:#fff;font-weight:600;} /* Gaya tombol utama Simpan */
    .btn-muted{background:transparent;border:1px solid var(--border);color:var(--muted);} /* Gaya tombol sekunder Batal */
  </style> <!-- Menutup blok gaya CSS internal -->
</head> <!-- Menutup kepala dokumen -->
<body> <!-- Membuka isi halaman -->
  <div class="container"> <!-- Membuka pembungkus utama form -->
    <div class="card"> <!-- Membuka kartu form -->
      <h1>{{FORM_TITLE}}</h1> <!-- Placeholder judul form kandidat -->
      <form method="post" action="index.php?modul=kandidat"> <!-- Membuka form POST yang mengarah ke modul kandidat -->
        <input type="hidden" name="modul" value="kandidat"> <!-- Menyertakan identitas modul kandidat pada payload POST -->
        <input type="hidden" name="action" value="{{ACTION}}"> <!-- Placeholder aksi POST ('tambah' atau 'ubah') -->
        <input type="hidden" name="id" value="{{ID}}"> <!-- Placeholder ID kandidat untuk mode ubah -->
        <div> <!-- Membuka kolom input nama -->
          <label for="nama">Nama Kandidat</label> <!-- Label input nama kandidat -->
          <input id="nama" name="nama" type="text" placeholder="Nama lengkap kandidat" value="{{NAMA}}" required> <!-- Input teks nama kandidat dengan prefill -->
        </div> <!-- Menutup kolom input nama -->
        <div> <!-- Membuka kolom input posisi -->
          <label for="posisi">Posisi Dilamar</label> <!-- Label input posisi dilamar -->
          <input id="posisi" name="posisi" type="text" placeholder="Misal: Backend Developer" value="{{POSISI}}" required> <!-- Input teks posisi dilamar dengan prefill -->
        </div> <!-- Menutup kolom input posisi -->
        <div> <!-- Membuka kolom input domisili -->
          <label for="domisili">Domisili</label> <!-- Label input domisili -->
          <input id="domisili" name="domisili" type="text" placeholder="Misal: Bandung" value="{{DOMISILI}}" required> <!-- Input teks domisili dengan prefill -->
        </div> <!-- Menutup kolom input domisili -->
        <div> <!-- Membuka kolom input skor tes -->
          <label for="skorTes">Skor Tes (0-100)</label> <!-- Label input skor tes -->
          <input id="skorTes" name="skorTes" type="number" min="0" max="100" step="1" value="{{SKOR_TES}}"> <!-- Input angka skor tes rentang 0-100 -->
        </div> <!-- Menutup kolom input skor tes -->
        <div class="full"> <!-- Membuka kolom input pengalaman kerja selebar penuh -->
          <label for="pengalamanTahun">Pengalaman Kerja (Tahun)</label> <!-- Label input pengalaman kerja -->
          <input id="pengalamanTahun" name="pengalamanTahun" type="number" min="0" step="1" value="{{PENGALAMAN_TAHUN}}"> <!-- Input angka pengalaman kerja dalam tahun -->
        </div> <!-- Menutup kolom input pengalaman kerja -->
        <div class="full actions"> <!-- Membuka baris tombol aksi -->
          <a href="index.php?modul=kandidat" class="btn btn-muted">Batal</a> <!-- Tautan kembali ke daftar kandidat -->
          <button type="submit" class="btn btn-primary">Simpan</button> <!-- Tombol submit untuk menyimpan data kandidat -->
        </div> <!-- Menutup baris tombol aksi -->
      </form> <!-- Menutup elemen form -->
    </div> <!-- Menutup kartu form -->
  </div> <!-- Menutup pembungkus utama -->
</body> <!-- Menutup isi halaman -->
</html> <!-- Menutup elemen root HTML -->
